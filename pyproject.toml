[project]
name = "skill-router"
version = "0.1.0"
description = "Route an agent's intent to the right installed skill with TypeSafe's Jev"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typesafe-sdk>=0.7.0",
    "mcp>=2.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
skill-router = "skill_router.cli:main"
skill-router-mcp = "skill_router.mcp_server:main"

[build-system]
requires = ["uv_build>=0.8.21,<0.9.0"]
build-backend = "uv_build"
